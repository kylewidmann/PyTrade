[tool.poetry]
name = "pytrade-repo"
package-mode = false
version = "0.1.0"
description = "PyTrade monorepo — core trading abstractions, backtesting engine, and Oanda adapter"
authors = ["Kyle Widmann <Kyle.Widmann@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
pytrade = {path = "src/pytrade", develop = true}
pytrade-backtest = {path = "src/pytrade-backtest", develop = true}
pytrade-oanda = {path = "src/pytrade-oanda", develop = true}

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
pytest-cov = "^4.1.0"
pytest-asyncio = "^0.23.7"
pytest-benchmark = "^4.0.0"
bandit = "^1.7.8"
flake8 = "^7.0.0"
black = "^24.3.0"
isort = "^5.13.2"
mypy = "^1.9.0"
autoflake = "^2.3.1"
pandas-stubs = "^2.2.2.240603"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
pythonpath = ["."]

[tool.coverage.report]
exclude_also = [
    "def __repr__",
    "if self\\.debug",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]
omit = [
    "src/pytrade/pytrade/interfaces/*",
    "src/pytrade/pytrade/events/*",
]

[[tool.mypy.overrides]]
module = ["plotly.*"]
ignore_missing_imports = true
